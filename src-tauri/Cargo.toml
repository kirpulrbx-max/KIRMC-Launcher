[package]
name = "kirmc-launcher"
version = "0.1.0"
description = "KIRMC Launcher — launcher de Minecraft ultraligero"
edition = "2021"

[lib]
name = "kirmc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
futures-util = "0.3"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
md-5 = "0.10"
# Servidor de skins local (Yggdrasil para authlib-injector): firma RSA de las texturas
rsa = { version = "0.9", features = ["sha1", "pem"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
dirs = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Tokens de Microsoft en el almacén seguro del SO (Credential Manager / Keychain / Secret Service)
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
