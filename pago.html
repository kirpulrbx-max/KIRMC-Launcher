<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>KIRMC · Pago</title>
<link rel="icon" href="img/icon.png">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root { --red: #E51E1E; --brown: #3A1A10; --cream: #fff8ec; --yellow: #FFCD3C; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    font-family: "M PLUS Rounded 1c", system-ui, sans-serif; color: var(--brown); background: var(--red); }
  .card { width: min(440px, 100%); background: var(--cream); border: 3px solid var(--brown); border-radius: 22px;
    box-shadow: 6px 6px 0 var(--brown); padding: 28px 24px; text-align: center; }
  .coin { width: 78px; height: 78px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center;
    background: var(--yellow); border: 3px solid var(--brown); font: 34px "Dela Gothic One", sans-serif; box-shadow: 4px 4px 0 var(--brown); }
  h1 { margin: 0 0 8px; font: 26px "Dela Gothic One", sans-serif; }
  p { margin: 0; font-weight: 500; line-height: 1.5; }
  .bad .coin { background: #ffd4d4; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="coin" id="icon">K</div>
  <h1 id="title">Procesando…</h1>
  <p id="text"></p>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const estado = q.get("estado"), coins = Number(q.get("coins")) || 0;
  const msg = {
    ok: ["¡Pago completado!", coins ? `Se sumaron ${coins.toLocaleString("es")} K coins a tu cuenta KIRMC. Ya puedes cerrar esta pestaña y volver al launcher.` : "Las K coins ya están en tu cuenta. Vuelve al launcher."],
    pendiente: ["Pago en proceso", "PayPal aún no confirmó el cobro. Las K coins llegarán solas en cuanto se confirme."],
    cancelado: ["Pago cancelado", "No se cobró nada. Puedes volver al launcher cuando quieras."],
    error: ["Algo salió mal", "No se pudo completar el pago. Si PayPal te cobró, escríbenos y lo resolvemos."],
  }[estado] || ["KIRMC", "Vuelve al launcher."];
  document.getElementById("title").textContent = msg[0];
  document.getElementById("text").textContent = msg[1];
  if (estado !== "ok") { document.getElementById("card").classList.add("bad"); document.getElementById("icon").textContent = estado === "cancelado" ? "×" : "!"; }
</script>
</body>
</html>
